[0. Toggles]

## Add caliber values to the ammo short name.
# Setting type: Boolean
# Default value: true
Enable caliber on ammo = true

## Add caliber values to the ammo boxes short name.
# Setting type: Boolean
# Default value: true
Enable caliber on ammo boxes = true

## Add caliber values to the magazines short name.
# Setting type: Boolean
# Default value: true
Enable caliber on magazines = true

## Replace the default caliber values on weapons with the values from the mod.
# Setting type: Boolean
# Default value: true
Enable caliber on weapons = true

## Display caliber when hovering over loot in raid
# Setting type: Boolean
# Default value: true
Enable caliber on in-raid loot = true

## Alternative comparator for ammo sorting
# Setting type: Boolean
# Default value: true
Enable ammo & ammo boxes sorting = true

## Hold a key to show item names instead of prices at traders
# Setting type: Boolean
# Default value: true
Enable names in trading = true

[1. General]

## Remove value marks (★☆●○) from ammo short names
# Setting type: Boolean
# Default value: false
Remove value marks = false

## Remove value marks from ammo names in raid
# Setting type: Boolean
# Default value: false
Remove value marks in raid = false

## Characters to strip from the beginning of ammo names
# Setting type: String
# Default value: ★☆●○
Value marks = ★☆●○

## Color for the caliber text in ammo
# Setting type: Color
# Default value: A1A1A1FF
Caliber color = A1A1A1FF

## Swap name with caliber
# Setting type: Boolean
# Default value: false
Swap name = false

[2. Item Names In Trading]

## Keybind to show item names
# Setting type: KeyboardShortcut
# Default value: LeftAlt
Show names keybind = LeftAlt

