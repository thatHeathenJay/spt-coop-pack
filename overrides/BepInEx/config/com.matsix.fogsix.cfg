[Legacy]

## LEGACY RAYMARCH ONLY — no effect while Froxel Fog is on. Steps per ray of the old screen-space march. Higher = smoother (less banding), more GPU.
# Setting type: Int32
# Default value: 64
# Acceptable value range: From 8 to 128
Raymarch Steps (Legacy) = 64

## LEGACY RAYMARCH ONLY — no effect while Froxel Fog is on. Fixed per-pixel march offset that dissolves coarse-step banding into grain. Froxel mode has no per-pixel jitter at all, which is the point of it.
# Setting type: Single
# Default value: 1
# Acceptable value range: From 0 to 1
Step Jitter (Legacy) = 1

## LEGACY RAYMARCH ONLY — no effect while Froxel Fog is on. Marches the old path at half resolution with a depth-aware upsample.
# Setting type: Boolean
# Default value: false
Half-Resolution Marching (Legacy) = false

## LEGACY RAYMARCH ONLY — no effect while Froxel Fog is on. Distance where wisp noise fades to uniform fog and stops being computed. 0 = never fade.
# Setting type: Single
# Default value: 400
# Acceptable value range: From 0 to 2000
Wispiness Fade Distance (Legacy) = 400

[Lights]

## Let realtime point/spot lights (your flashlight, lamps, flares) brighten and beam through the fog. No shadows, so light passes through walls (a known limitation for world lights).
# Setting type: Boolean
# Default value: true
Local Lights = true

## How strongly local lights light up the fog. Raise for brighter beams/glow.
# Setting type: Single
# Default value: 1.5
# Acceptable value range: From 0 to 2
Light Brightness = 1.5

## Multiplier on each light's reach into the fog (how far the glow extends).
# Setting type: Single
# Default value: 1
# Acceptable value range: From 0.2 to 3
Light Range = 1

## How forward-scattering local lights are. HIGH = a tight beam that only glows when you look into it and barely veils objects seen through it from the side; LOW = a broad, hazy glow that washes the background. Raise this if distant objects light up when you look through a beam.
# Setting type: Single
# Default value: 0.5
# Acceptable value range: From 0 to 0.9
Light Focus = 0.5

## How fast a light's glow dims away from the bulb. HIGH = realistic inverse-square look: bright core, fades fast, no visible boundary. LOW = the glow stays strong out to its full range — but against the sky the range boundary can read as a soft disc/circle around the light. Lower it if lights feel too dim after this change (and/or raise Light Brightness).
# Setting type: Single
# Default value: 25
# Acceptable value range: From 0 to 100
Light Falloff = 25

## Feathers the edge of spotlight beams in the fog: brightness ramps in from the cone edge toward the beam core instead of cutting at the surface. 0 = hard-edged cone (sharpest, and skips the extra math entirely).
# Setting type: Single
# Default value: 0
# Acceptable value range: From 0 to 1
Light Edge Softness = 0

## How many lights can glow in the fog at once (the most important nearby ones win). Higher = farther lamps glow too on light-dense maps like Streets; costs GPU per light.
# Setting type: Int32
# Default value: 24
# Acceptable value range: From 1 to 32
Max Lights = 24

[Look]

## Fog extinction at FULL fog (when WeatherCurve.Fog reaches 'Full Fog At'). ~0.03 cuts player visibility to roughly what SAIN cuts bot vision to in heavy fog (~40%), so it stays fair; raise for thicker fog (but then you see less far than the bots do).
# Setting type: Single
# Default value: 0.03
# Acceptable value range: From 0 to 0.2
Density Scale = 0.03

## The WeatherCurve.Fog value treated as FULL (max-density) fog. 0.075 = Tarkov's 'Heavy fog', so the in-game weather settings actually scale the fog (Fog lighter, Heavy fog full), with Heavy fog matched to SAIN's max bot-vision penalty. Drop it to 0.018 (SAIN's cap) for strict fairness at every fog level — but then 'Fog' and 'Heavy fog' look identical (both already max the bots' penalty, so the visual can't tell them apart).
# Setting type: Single
# Default value: 0.075
# Acceptable value range: From 0.001 to 0.2
Full Fog At = 0.075

## World-anchored ground fog: the dense layer sits at the map's ground level and thins with ALTITUDE, so it pools in valleys/trees and you can climb hills or buildings above it and look down on it. Off = the fog follows your camera height (always around you, can't get above it). When on, use Height Offset to position the layer and Height Falloff for its thickness.
# Setting type: Boolean
# Default value: true
Ground Fog = true

## How fast the fog thins with altitude. Smaller = taller fog layer (reaches higher). With Ground Fog on, this is the layer's thickness — lower it if fog is too thin at head height, raise it to escape the fog at a lower altitude.
# Setting type: Single
# Default value: 0.04
# Acceptable value range: From 0 to 0.3
Height Falloff = 0.04

## Raises (+) / lowers (-) the full-density fog floor. Relative to the camera normally; relative to the map's ground level (LevelSettings.ZeroLevel) when Ground Fog is on — raise it until fog is dense at your feet, then hills above that poke out of the fog.
# Setting type: Single
# Default value: 0
# Acceptable value range: From -300 to 300
Height Offset = 0

## 0 = uniform haze, 1 = fully wispy fog.
# Setting type: Single
# Default value: 1
# Acceptable value range: From 0 to 1
Wispiness = 1

## Size of the wisps (smaller = larger features).
# Setting type: Single
# Default value: 0.052
# Acceptable value range: From 0.001 to 0.1
Noise Scale = 0.052

## Strength of the sun's glow through the fog by day (0 = none).
# Setting type: Single
# Default value: 1
# Acceptable value range: From 0 to 4
Sun Glow = 1

## Strength of the moon's glow through the fog at night (0 = none).
# Setting type: Single
# Default value: 1
# Acceptable value range: From 0 to 4
Moon Glow = 1

## Colour the sun's glow through the fog from a physically-based atmosphere (white sun reddened along the sun ray) instead of Tarkov's TOD colours — matches the sun on the CloudSix clouds. On = physical; off = the old TOD colour.
# Setting type: Boolean
# Default value: true
Atmospheric Sun Color = true

## How red the fog's sun glow goes at sunrise/sunset. 1 = orange (default); lower = more neutral; higher = deeper red. Only when 'Atmospheric Sun Color' is on.
# Setting type: Single
# Default value: 1
# Acceptable value range: From 0 to 2
Sun Color Warmth = 1

## How much the base fog haze warms toward the sunset colour near the horizon (golden hour), so the distant fog doesn't read a clinical white while the sky and clouds go gold. 0 = flat neutral base; higher = warmer. Uses 'Sun Color Warmth' for how warm.
# Setting type: Single
# Default value: 0.4
# Acceptable value range: From 0 to 1
Base Warmth = 0.4

## How tightly the glow concentrates toward the sun.
# Setting type: Single
# Default value: 0.7
# Acceptable value range: From 0 to 0.9
Sun Glow Focus = 0.7

## Multiplier on the game's live wind for fog drift.
# Setting type: Single
# Default value: 10
# Acceptable value range: From 0 to 50
Wind Speed = 10

## Older analytic glass fog, replaced by Volumetric Glass. Fogs glass/windows from the game's _Density global, which our fog patch leaves stale; we drive it ourselves, weather-matched to the volumetric fog.
# Setting type: Boolean
# Default value: false
Fog Transparents = false

## Density of the fog on glass at FULL fog (Fog Transparents). Raise = thicker glass haze. (The game's own value is pinned near-zero, so we drive it ourselves.) 0 = off.
# Setting type: Single
# Default value: 0.025
# Acceptable value range: From 0 to 0.3
Transparent Fog Density = 0.025

## Brightness of the glass fog colour (Fog Transparents). The sky-derived colour is HDR-bright and blows out the glass's additive in-scatter — lower this if the glass over-brightens.
# Setting type: Single
# Default value: 1
# Acceptable value range: From 0 to 2
Transparent Fog Brightness = 1

## Windows fog from the volumetric fog itself, at their own distance (FogSix's port of the game's window shader, swapped in at raid load). Off = the game's window shader with its analytic fog.
# Setting type: Boolean
# Default value: true
Volumetric Glass = true

[Performance]

## Frostbite-style froxel volumetrics (Hillaire 2015): fog density and lighting are computed once per view-frustum voxel into a small 3D volume, accumulated over frames IN the volume, and each pixel just integrates that tiny volume — there is NO per-pixel jitter or noise anywhere in this mode, by construction. Most stable AND cheapest mode. While on, Raymarch Steps / Step Jitter / Half-Resolution Marching don't apply (they belong to the legacy raymarch, which Off restores).
# Setting type: Boolean
# Default value: true
Froxel Fog = true

## Froxel grid size: Low 128x72, Medium 160x92, High 240x136 screen tiles. Higher = crisper fog shapes/shaft edges for more GPU. Fog is soft — Medium is usually plenty.
# Setting type: EFroxelRes
# Default value: High
# Acceptable values: Low, Medium, High
Froxel Resolution = High

## Depth slices in the froxel volume (exponentially spaced, 0.5m to Froxel Range). More = finer near/mid detail (mist bands, shaft edges).
# Setting type: Int32
# Default value: 32
# Acceptable value range: From 16 to 128
Froxel Depth Slices = 32

## Distance the froxel volume covers, metres. Beyond it the fog switches to the exact analytic height-fog integral (perfectly smooth; wisps/god rays/dust are near-field effects and only exist inside this range).
# Setting type: Single
# Default value: 200
# Acceptable value range: From 50 to 500
Froxel Range = 200

## Frame-to-frame accumulation of the fog. In Froxel Fog mode this is the volume history blend (the Frostbite temporal integration): higher = smoother, more converged fog; 0.9-0.95 recommended, and changes to weather/lights still track within a few frames. 0 = no accumulation (raw per-frame volume). In legacy mode it drives the old screen-space history resolve instead.
# Setting type: Single
# Default value: 0.95
# Acceptable value range: From 0 to 0.95
Temporal Smoothing = 0.95

## Fetches the wisp/mist/dust noise from a pre-baked tiling 3D texture (one texture tap per step) instead of recomputing it per raymarch step — the single biggest per-step GPU cost. Same look (the pattern repeats every ~800 m, hidden by wind drift). Off = the exact procedural noise, for A/B.
# Setting type: Boolean
# Default value: true
Baked Noise Texture = true

[Range]

## Fog starts this many metres from the camera.
# Setting type: Single
# Default value: 0
# Acceptable value range: From 0 to 100
Start Distance = 0

## How far the fog reaches (also caps the march for the sky).
# Setting type: Single
# Default value: 2000
