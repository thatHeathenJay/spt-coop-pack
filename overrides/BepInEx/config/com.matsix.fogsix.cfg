## Settings file was created by plugin FogSix v1.0.1
## Plugin GUID: com.matsix.fogsix

[General]

## Replace Tarkov's fog with volumetric fog. Off: flatscreen restores Tarkov's vanilla fog; in VR (SPT-VR loaded) it disables Tarkov's fog entirely instead, since it renders wrong in stereo.
# Setting type: Boolean
# Default value: true
Enabled = true

## Log the live weather Fog value + computed density and the light/fog CPU timings once a second.
# Setting type: Boolean
# Default value: false
Debug Log = false

[Ground Mist]

## A thin, wispy mist hugging the ground that drifts between the trees — a separate sharp low layer on top of the main height fog. Anchored to the map's ground (use Mist Height to sit it on the terrain you walk on).
# Setting type: Boolean
# Default value: false
Ground Mist = false

## How thick the ground mist is. Raise for soupier mist.
# Setting type: Single
# Default value: 0.05
# Acceptable value range: From 0 to 1
Mist Density = 0.05

## World height of the mist relative to the map's ground level. Raise/lower until the mist sits at your feet (the ground reference is often below play height).
# Setting type: Single
# Default value: -10
# Acceptable value range: From -300 to 300
Mist Height = -10

## How tall the mist band is, in metres — it fades out above this. Small = low-lying ground mist; larger = a deeper bank.
# Setting type: Single
# Default value: 3
# Acceptable value range: From 0.5 to 30
Mist Thickness = 3

## Size of the wisps. Smaller value = bigger, smoother patches.
# Setting type: Single
# Default value: 0.05
# Acceptable value range: From 0.005 to 0.2
Mist Wisp Size = 0.05

## Higher = patchier, with clearer gaps between the wisps; lower = more even.
# Setting type: Single
# Default value: 3
# Acceptable value range: From 1 to 6
Mist Patchiness = 3

## Turbulence/detail of the wisps. 0 = smooth round blobs; higher = swirly, organic, wispy structure inside each clump.
# Setting type: Single
# Default value: 0.8
# Acceptable value range: From 0 to 3
Mist Detail = 0.8

[Interiors]

## Thin the fog inside buildings. Primary: the game's own indoor shelter volumes, cleared exactly along each view ray (correct through windows, any room size). Fallback for interiors those don't cover: Tarkov's per-pixel interior mask, distance-gated. Off = fog fills interiors.
# Setting type: Boolean
# Default value: true
Interior Fog Thinning = true

## How much to thin the fog inside buildings. 0 = no change, 1 = fully clear indoors.
# Setting type: Single
# Default value: 0.8
# Acceptable value range: From 0 to 1
Interior Reduction = 0.8

## Clear fog along the exact indoor SEGMENTS of each view ray, using the game's IndoorTrigger shelter boxes (what it uses for rain/reverb indoors). Fixes the per-pixel model's failure cases: big rooms clear to the far wall, and looking in a window no longer punches a hole in the outdoor fog. Off = the old per-pixel model everywhere.
# Setting type: Boolean
# Default value: true
Interior Shelter Volumes = true

## Scales the shelter boxes. Below 1 shrinks them (a film of fog appears at walls/ceilings if a box under-fills its room); above 1 grows them (clearing can leak just outside doorways and windows). 1 = the game's exact boxes.
# Setting type: Single
# Default value: 1.015
# Acceptable value range: From 0.5 to 1.5
Interior Volume Padding = 1.015

## Recon overlay: GREEN where the view ray passes through a shelter volume (brighter = more of the ray covered), RED where the game's pixel mask marks interior, BLUE where the surface is under the map's rain cover. Red-ONLY rooms have no volumetric signal at all (pixel fallback). Needs Interior Fog Thinning on. Turn off after checking.
# Setting type: Boolean
# Default value: false
Interior Volume Debug View = false

## Thin the fog wherever the map's RAIN can't reach, sampled from the game's own rain-occlusion depth map (the WeatherObstacle mesh). Catches interiors that have no shelter volume — if rain can't get into a building, its fog thins. Note it applies under ANY authored rain cover (overhangs, possibly tree canopies — check the debug view's BLUE tint). 0 = off.
# Setting type: Single
# Default value: 0.4
# Acceptable value range: From 0 to 1
Rain-Cover Reduction = 0.4

## Depth convention of the rain-cover map. ON is correct on this build (reversed-Z); flip only if cover reads inverted (fog thins in the open, stays thick under roofs).
# Setting type: Boolean
# Default value: true
Rain-Cover Flip = true

## Metres below the rain-cover surface over which the shelter fades in. Small = crisp under roof edges; larger = softer.
# Setting type: Single
# Default value: 1
# Acceptable value range: From 0.1 to 5
Rain-Cover Bias = 1

## FALLBACK-model reach (interiors with no shelter volume): only clear the fog on interior surfaces within this distance (m) of you. Lower = tighter (fewer stray clears from outside a window), but a big fallback room may keep fog on its far wall.
# Setting type: Single
# Default value: 5
# Acceptable value range: From 0 to 150
Interior Max Clear Distance = 5

## Feathers the interior mask's hard rectangular edges so the fog thins with a soft transition instead of a crisp cutout. 0 = off (sharp).
# Setting type: Single
# Default value: 0
# Acceptable value range: From 0 to 0.02
Interior Edge Softness = 0

## Which channel of the game's interior mask marks 'indoors'. 3 = alpha (the usual one, since the interior tint is often black so only alpha carries coverage); 4 = brightest of R/G/B; 0/1/2 = R/G/B. If interiors aren't thinning, turn on Interior Debug View to see which channel lights up.
# Setting type: Int32
# Default value: 3
# Acceptable value range: From 0 to 4
Interior Mask Channel = 3

## Replace the screen with the game's raw interior mask: RED where its alpha is set, GREEN where any RGB is set. Building interiors should light up. If they're RED set Mask Channel to 3; if GREEN set it to 4. Turn this off once picked.
# Setting type: Boolean
# Default value: false
Interior Debug View = false

