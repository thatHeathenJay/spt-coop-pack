Max Distance = 2000

[Sun Shadows]

## God rays: shadow the sun's glow in the fog where trees/buildings block it, so you get shafts of light. Samples the sun's shadow map.
# Setting type: Boolean
# Default value: true
Sun Shadows = true

## How dark the shadowed shafts are. 0 = no shadowing, 1 = full.
# Setting type: Single
# Default value: 1
# Acceptable value range: From 0 to 1
Shadow Strength = 1

## Depth bias to kill shadow acne (self-shadowing speckle). Raise if the fog is speckled with shadow noise; lower if shafts look detached from the trees.
# Setting type: Single
# Default value: 0.002
# Acceptable value range: From -0.05 to 0.05
Shadow Bias = 0.002

## Flips the shadow depth comparison for the platform's Z convention. ON is correct on this build (reversed-Z); untick only if shafts come out inverted (lit where it should be dark).
# Setting type: Boolean
# Default value: true
Flip Shadow = true

## How far the god rays reach (metres). The sun's shadow map only has good data near the camera; beyond this the fog is just lit (no shadow). LOWER this if you see a soft circle/disc in the distance — that's the shadow map going unreliable past its range.
# Setting type: Single
# Default value: 300
# Acceptable value range: From 10 to 300
Shadow Distance = 300

## Blurs the shadow shafts (PCF). Higher = softer, hazier shafts; 0 = razor sharp (every leaf visible). Real god rays are soft, so a little goes a long way.
# Setting type: Single
# Default value: 0.002
# Acceptable value range: From 0 to 0.01
Shadow Softness = 0.002

## Dust motes drifting/glowing inside the sun shafts. 0 = off. Raise for a dustier, particle-filled beam.
# Setting type: Single
# Default value: 3
# Acceptable value range: From 0 to 3
Shaft Dust = 3

## Size of the dust specks. Higher = finer grain — but too fine flickers (the fog is only sampled every metre or so).
# Setting type: Single
# Default value: 1.5
# Acceptable value range: From 0.05 to 1.5
Dust Grain Size = 1.5

## How far from you the dust motes show (m): full strength to half this distance, gone by it. Farther out the fog cells get too coarse for motes and the dust just reads as shimmer — lower this if it does.
# Setting type: Single
# Default value: 40
# Acceptable value range: From 5 to 150
Dust Distance = 40

