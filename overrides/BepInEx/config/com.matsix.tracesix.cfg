## Settings file was created by plugin TraceSix v1.0.1
## Plugin GUID: com.matsix.tracesix

[1. General]

## Global illumination: sunlight, skylight and lamp light bounce off surfaces and light the world around them, in place of the game's flat ambient light. Off = the game's own lighting.
# Setting type: Boolean
# Default value: true
Enabled = true

## Switches Enabled off and on, to compare the picture with and without. Switched back on, the light fades in over about a second and a half.
# Setting type: KeyboardShortcut
# Default value: Insert
Toggle Key = Insert

## How bright the bounced light is. 1 = exactly what the game's own sun and sky give, which leaves shade and window-lit rooms darker than an eye would see them. Higher = rooms read more as they would to someone standing in them.
# Setting type: Single
# Default value: 1.5
# Acceptable value range: From 0 to 3
Strength = 1.5

## How far around you the finest (half-metre) light reaches, in metres. Beyond it coarser light takes over, which in large interiors can show as corners and walls brightening as you come up to them. 16 = closer in, with a sharper hand-over; the light updates cost about a third less and settle sooner.
# Setting type: Int32
# Default value: 24
# Acceptable values: 16, 24
Detail Reach = 24

## How much of the light is recalculated every frame. Higher costs more; lower is cheaper, and the light then takes longer to settle after something changes (walking into a new area, the time of day).
# Setting type: Int32
# Default value: 1
# Acceptable values: 1, 2, 4, 8
Light Update Rate = 1

## The map's lamps bounce their light too, and walls between a lamp and a surface block it. Off = sun and sky only. The lamps' own direct light is the game's either way.
# Setting type: Boolean
# Default value: true
Lamp Light = true

## Flashlights bounce their light too - yours and the nearest few others that are on - following the light every frame. Costs something only while such a light is on near you. Needs Lamp Light.
# Setting type: Boolean
# Default value: true
Moving Lights = true

## The scope's picture gets the bounced light too, so what you see through a scope is lit like what is around it. Costs a second, smaller pass while you look through a scope.
# Setting type: Boolean
# Default value: true
Indirect Light In Scopes = true

## Runs the mod in VR (SPT-VR): the bounced light, each eye drawn on its own - about twice the flat screen's cost. The ray-traced light in VR also needs Ray Tracing In VR (EXPERIMENTAL), an advanced setting under Ray Tracing. Off = the game's own lighting in VR.
# Setting type: Boolean
# Default value: true
VR Support = true

## Keeps the door and window openings the game itself marks open in the light's copy of the world, so daylight reaches rooms whose windows are framed too finely for it. Takes effect as the area around you is rebuilt (walk about 15 m).
# Setting type: Boolean
# Default value: true
Open Doors And Windows = true

## Maps the mod stays off on, by the game's own map names, separated by commas (the log names the map at the start of every raid). The Lab and the Labyrinth are sealed and lit by lamps alone, and look as intended with the game's own fill light. Read when a raid starts.
# Setting type: String
# Default value: laboratory,labyrinth
Maps Without Indirect Light = laboratory,labyrinth

## Glowing surfaces that have no lamp of their own - signs, screens, billboards, lit logos, Factory's daylit windows - give light too, bounced onto what is around them, as bright as the game draws them. The glow of a lamp's own fixture is left to that lamp's light. Switches at once; which surfaces glow is worked out when a raid starts.
# Setting type: Boolean
# Default value: true
Glowing Surfaces Give Light = true

## Smooths the light along each surface before it goes on the picture, hiding the blocky edges of the light cells. Off = the cells as they are.
# Setting type: Boolean
# Default value: true
Smooth Indirect Light = true

## A level of 1 m light cells between the 0.5 m ones around you and the 2 m ones further out, so the light gets coarser in two small steps instead of one large one. No frame-time cost, about a third more video memory. Off = three levels.
# Setting type: Boolean
# Default value: true
In-Between Detail = true

## How many rays a light cell sends each time it updates. 32 doubles their cost, and is a little calmer in places lit from many directions at once.
# Setting type: Int32
# Default value: 16
# Acceptable values: 16, 32
Rays Per Cell = 16

## At most this many in a hundred of the light cells updated in a frame send their rays; the rest wait for their next turn. Caps the cost in cluttered places, which then settle a little slower. Cells that have just come into reach always send theirs. 100 = no cap.
# Setting type: Int32
# Default value: 45
# Acceptable values: 100, 60, 45, 30
Light Ray Budget = 45

## The game's artists placed shadowless fill lights (named ...GI) beside many lamps, as a stand-in for the light that lamp bounces. On = those are bounced as well. Off = only where one is all that is lit of its lamp: elsewhere the mod already works out the lamp's bounce itself, and the stand-in adds to it. The game draws them either way.
# Setting type: Boolean
# Default value: true
Bounce Fill Lights = true

## Glowing Surfaces Give Light: a glowing surface with one of the game's lights within this many metres of it is taken to be lit by that light already (ceiling light strips, lamp panels: the game's lights sit on them) and gives no light of its own. 0 = every glowing surface that is not a lamp fixture. Read when a raid starts.
# Setting type: Single
# Default value: 1
# Acceptable value range: From 0 to 5
Glow Lamp Distance = 1

[2. Glass]

## Makes the glass-block windows the game draws as solid walls see-through: what is behind them shows through, blurred and tinted by the glass, while the mortar between the blocks stays solid. Off = the game's solid look.
# Setting type: Boolean
# Default value: true
See-Through Glass Windows = true

## See-Through Glass Windows: how much of what is behind the glass shows through. 0 = the game's solid look, 1 = only what is behind it (its reflections stay).
# Setting type: Single
# Default value: 0.4976526
# Acceptable value range: From 0 to 1
Glass Transparency = 0.4976526

## See-Through Glass Windows: how much of the glass's own colour what is behind it (and the sunlight through it) takes. 0 = clear glass, 1 = the full colour.
# Setting type: Single
# Default value: 1
# Acceptable value range: From 0 to 1
Glass Tint = 1

## See-Through Glass Windows: how blurred what is seen through the glass is. 0 = clear, 1 = strongly frosted.
# Setting type: Single
# Default value: 0.4037559
# Acceptable value range: From 0 to 1
Glass Frost = 0.4037559

[3. Ray Tracing]

## Hardware ray tracing against the map's real geometry (needs a GPU and driver with DirectX ray tracing tier 1.1). When a raid starts with it on, the game pauses for a few seconds, once, while the map is read in; that takes about 1 GB of video memory until the raid ends (switched off mid-raid, it is kept until then). Off = the voxel light only.
# Setting type: Boolean
# Default value: false
Ray Tracing = false

## The bounced light comes from the rays instead of the voxel lookup: shadowing and contact shading from the real geometry, with the voxel light cells answering for the light past the traced bounces and past Ray Length. Off = the voxel light, while the ray-traced shadows below keep working.
# Setting type: Boolean
# Default value: true
RT Global Illumination = true

## Rays are traced from one pixel in every N x N. 1 = every pixel (about four times the cost of 2), 2 = a quarter of them, 3 or 4 = cheaper and softer.
# Setting type: Int32
# Default value: 2
# Acceptable value range: From 1 to 4
Pixel Step = 2

## Rays from each traced pixel per frame. More = less grain, about the whole cost again per ray.
# Setting type: Int32
# Default value: 1
# Acceptable value range: From 1 to 16
Rays Per Pixel = 1

## Where a ray hits, one more ray, so the second bounce also comes from the real geometry instead of the light cells: less light leaking through thin walls, at a noticeable cost and a little more grain.
# Setting type: Boolean
# Default value: true
Traced Second Bounce = true

## Rays take the real colour of the textures they hit, and leaves, fences and grates stop rays only where they are solid. Off = the voxels' coarser colours. About 100 MB of video memory at the default Ray-Traced Texture Size. Takes effect at the next raid.
# Setting type: Boolean
# Default value: true
Ray-Traced Textures = true

## The lamps' direct light is shadowed by the real geometry: no more lamp light through walls, shelves and floors (most of the game's lamps cast no shadow of their own). Each lamp keeps the game's look.
# Setting type: Boolean
# Default value: true
Ray-Traced Direct Lamp Shadows = true

## Sun shadows traced against the map's real geometry: shadows as far as you can see, from small and thin things too, with edges that soften with distance from what casts them.
# Setting type: Boolean
# Default value: true
Ray-Traced Sun Shadows = true

## How the ray-traced sun shadows go with the game's own. RayTracedWorld = the map's shadows come from the rays alone, and the game still shadows what the rays do not see (you, your gun, bots, grass, swaying leaves); the game's shadow pass also draws far less. Mixed = the darker of the two everywhere.
# Setting type: RtSunMode
# Default value: RayTracedWorld
# Acceptable values: Mixed, RayTracedWorld
Sun Shadow Mode = RayTracedWorld

## The scope's picture traces its own sun shadows, so what you see through a scope is shadowed like what is around it. Off = the scope has the game's shadows.
# Setting type: Boolean
# Default value: true
Ray-Traced Sun Shadows In Scopes = true

## VR: each eye's ray-traced light is blended with the other eye's where both see the same surface and agree up to their noise (Philippi, Frisvad and Jensen 2023), so the leftover grain is the same in both eyes instead of shimmering between them. Where the eyes truly differ - a surface only one eye sees, an edge - each keeps its own. Costs one light pass an eye. Needs Ray Tracing In VR (EXPERIMENTAL). Off = each eye's light alone.
# Setting type: Boolean
# Default value: true
Stereo Blend In VR = true

## VR (SPT-VR, with VR Support on): the ray-traced light on the VR camera too, each eye traced on its own - about twice the flat screen's cost, and the eyes' grain can differ (Stereo Blend In VR evens it out). Ray-traced sun and lamp shadows, AO and reflections stay flat screen only. Off = VR keeps the voxel light, and while you play in VR the map is not read in for the rays (no pause at the raid's start, no video memory).
# Setting type: Boolean
# Default value: false
Ray Tracing In VR (EXPERIMENTAL) = false

## Fine contact shading on top of the ray-traced light, for what is smaller than its rays resolve (seams, the gap under a crate, where an object meets the floor). ScreenSpace = AOSix's AO (needs AOSix), which also covers bots and loot. RayTraced = short rays from every pixel: no screen-space halos, but only the map casts it. Off = none.
# Setting type: RtAoMode
# Default value: ScreenSpace
# Acceptable values: Off, ScreenSpace, RayTraced
Ambient Occlusion = ScreenSpace

## How far each ray looks, in metres. Past that, the light comes from the light cells. Longer costs more.
# Setting type: Single
# Default value: 50
# Acceptable value range: From 1 to 200
Ray Length = 50

## Each frame only half of the traced pixels trace a new ray, in a checkerboard that swaps every frame; the others reuse their kept samples. Halves the tracing cost for a little more grain. Needs Reuse Ray Samples.
# Setting type: Boolean
# Default value: true
Half-Rate Tracing = true

## ReSTIR GI: each traced pixel keeps the best of what its rays found, and takes over better finds from its last frame and from a neighbour (only where a ray confirms nothing is in the way). Much less grain in rooms lit by a lamp or a doorway.
# Setting type: Boolean
# Default value: true
Reuse Ray Samples = true

## Reuse Ray Samples: how many frames a kept sample may stand for. More = calmer light, but a rare bright find lingers as a blotch around it. Fewer = blotches clear faster, a little more grain.
# Setting type: Int32
# Default value: 20
# Acceptable value range: From 1 to 32
Reuse History = 20

## Reuse Ray Samples: a sample taken over from a neighbour is left out where it would count more than this many times brighter or darker here (corners, where objects meet the floor). Lower = fewer bright specks there, a little less light shared.
# Setting type: Single
# Default value: 10
# Acceptable value range: From 1.5 to 10
Reuse Brightness Limit = 10

## Reuse Ray Samples: neighbours' finds also go into a lasting sample of each pixel, so a small bright area (the ground round a fire or a small lamp, seen from afar) spreads and settles instead of showing as blotches. Off = a neighbour's find is borrowed for one frame only.
# Setting type: Boolean
# Default value: false
Spread Ray Samples = false

## Half of each pixel's rays aim at the brightest points it and its neighbours have found (path guiding), weighted so the average light is unchanged. Small bright patches - the pool under a lamp - are found more often. Off by default: in dim rooms lit through a window it can make the light come and go in blobs.
# Setting type: Boolean
# Default value: false
Guided Light Rays = false

## Keeps each traced pixel's light over the frames before and blurs it along its own surface. Off = the raw rays of each frame (for comparison).
# Setting type: Boolean
# Default value: true
Denoise = true

## Denoise: each frame's light is blurred along its surface before it goes into the history (NVIDIA ReBLUR's pre-pass). A lucky bright ray no longer becomes a patch that sits, drifts and jumps - the boiling in dim rooms. Off = the history takes each frame's rays as they are.
# Setting type: Boolean
# Default value: true
Pre-Blur = true

## Denoise: when a lamp or a flashlight switches on or off near you, the bounce light round it follows within a few frames instead of fading over about a second - where its light really changed, the history starts over, and the kept ray samples count for little for a moment. That area is a little grainier for a quarter of a second. Off = the history fades to the new light at its usual pace.
# Setting type: Boolean
# Default value: true
Instant Light Switches = true

## Denoise: the finished light is also averaged over the last frames (NVIDIA ReBLUR's temporal stabilization), which calms the fine shimmer the blur leaves. It may only differ from the frame's own light by about the grain, so a real change (a door, a lamp shot out) still shows at once. Off = each frame's denoised light as it is.
# Setting type: Boolean
# Default value: true
Stabilize Output = true

## Denoise: a surface that has just come into view (turning, walking backwards, a door opening) starts from the voxel light there, counted as this many frames, instead of from a single ray - the blotchy edges while you turn. The ray-traced light takes over as frames come in. Higher = smoother new areas, but they show the voxel light longer (in dim rooms it can be a little brighter or flatter). 0 = off.
# Setting type: Int32
# Default value: 4
# Acceptable value range: From 0 to 16
Voxel Light For New Pixels = 4

## How many frames of light a traced pixel keeps. More = smoother, but light that changes (a door opening, a cloud over the sun) takes longer to follow.
# Setting type: Int32
# Default value: 32
# Acceptable value range: From 4 to 64
History Frames = 32

## A denoiser built like NVIDIA's ReLAX: it tracks how much each pixel's light varies and keeps a lone bright speck from being smeared into a blotch. Off = the standard denoiser, which keeps bounce shadows with Keep Bounce Shadows.
# Setting type: Boolean
# Default value: false
Variance-Guided Denoising = false

## With Variance-Guided Denoising off: how much the blur keeps the shadows bounced light casts (under a table, behind a crate, in corners). 0 = none kept. Higher = crisper bounce shadows, a little more grain along walls and in corners.
# Setting type: Single
# Default value: 0.5
# Acceptable value range: From 0 to 1
Keep Bounce Shadows = 0.5

## The most short rays a ray's end casts to find a light cell it can really see (which keeps light from leaking through thin walls). Past the limit that point takes no cell light: a little darker in clutter, never a leak. Higher = brighter in clutter, costs more there. 0 = no limit.
# Setting type: Int32
# Default value: 1
# Acceptable value range: From 0 to 20
Cell Check Ray Limit = 1

## Ray-Traced Direct Lamp Shadows: ReSTIR DI. The two lamps that light a point most are always traced; for the rest, each point keeps a record of the lamp worth tracing and takes over better ones from where it was last frame and from its neighbours, dropping lamps that turned out blocked - so in a room full of lamps the choice settles on the ones that really reach each point, instead of a new random one every frame. Off = one of the rest picked at random each frame.
# Setting type: Boolean
# Default value: true
Reuse Lamp Choices = true

## The ray-traced sun and lamp shadows are filtered where they are still noisy - penumbras, spots lit by several lamps, the light of a moving flashlight - as AMD's FidelityFX shadow denoiser does it: each pixel keeps track of how much its shadow jumps about, the sun's keeps up to 32 frames where it is steady, and it is blurred along its own surface only where it still jumps, so sharp shadow edges stay sharp. Off = the shadows as accumulated.
# Setting type: Boolean
# Default value: true
Denoise Ray-Traced Shadows = true

## How far a ray toward the sun looks for something in the way, in metres.
# Setting type: Single
# Default value: 400
# Acceptable value range: From 50 to 2000
Sun Ray Length = 400

## The sun's size in degrees: how quickly a shadow softens away from what casts it. 0.27 = the real sun; more = softer.
# Setting type: Single
# Default value: 0.27
# Acceptable value range: From 0 to 3
Sun Shadow Softness = 0.27

## Surfaces facing away from the sun are put in shadow without a ray: cheaper, but leaves lit from behind go dark and the sunny sides of trees speckle.
# Setting type: Boolean
# Default value: false
Sun Rays Skip Surfaces Facing Away = false

## Ray-Traced Textures: the size of each material's copy, in pixels. 128 = about 100 MB of video memory on a big map; 64 = a quarter of that, slightly blurrier ray-traced reflections. Takes effect at the next raid.
# Setting type: Int32
# Default value: 128
# Acceptable values: 32, 64, 128, 256
Ray-Traced Texture Size = 128

## With Ray-Traced Textures off: the chance that a ray hitting leaves, grates or fences is stopped. 0 = see-through, 1 = solid.
# Setting type: Single
# Default value: 0.5
# Acceptable value range: From 0 to 1
Leaf Cover = 0.5

## Ambient Occlusion = RayTraced: how far its rays look, in metres. Longer = wider shading.
# Setting type: Single
# Default value: 0.3
# Acceptable value range: From 0.05 to 1.5
Ray-Traced AO Radius = 0.3

## Ambient Occlusion = RayTraced: rays from each pixel per frame. More = less grain while moving, about the whole cost again per ray.
# Setting type: Int32
# Default value: 1
# Acceptable value range: From 1 to 8
Ray-Traced AO Rays = 1

[4. Voxel World]

## A copy of the world in 1 m voxels, 128 m across, between the 0.5 m one around you and the 2 m one beyond: what lies 25 - 50 m away (the far end of a corridor, the rooms across a hall) is lit through finer voxels. About 25 MB of video memory, and one more volume rebuilt as you move (every 13 m or so).
# Setting type: Boolean
# Default value: true
One-Metre Voxels = true

## The coarser voxel volumes (2 m and 8 m) are built from the same full-detail models as the detailed one. Off = from each object's simpler models where it has them, which can lack interior ceilings: a hall then looks roofless to the light until the detailed voxels reach it. Changing it during a raid reads the map again (the light drops out for some seconds).
# Setting type: Boolean
# Default value: true
Coarse Voxels From Full Detail = true

## The voxel world also takes the visible meshes the game keeps on its collision layer - Interchange's parking roof and floor are there. Off = left out: the garage is then open to the hall above for the light. Changing it during a raid reads the map again.
# Setting type: Boolean
# Default value: true
Voxelise Collider-Layer Geometry = true

## The voxel world also takes the visible meshes the game keeps on its culling layer - on Reserve every wall, floor and ceiling of the underground. Off = left out: Reserve's bunkers are then open to the sky for the light. Changing it during a raid reads the map again.
# Setting type: Boolean
# Default value: true
Voxelise Culling-Layer Geometry = true

## The lamps' own meshes (shade, panel, pole) are part of the light's copy of the world. Off = left out (the game lets a lamp's light shine through its own fixture; kept in, a hanging lamp's panel can catch its own light). Changing it during a raid reads the map again.
# Setting type: Boolean
# Default value: true
Lamp Fixtures In The Voxel World = true

## How many meshes are drawn into a voxel volume per frame while it rebuilds. Higher finishes a rebuild in fewer frames and costs more in each of them.
# Setting type: Int32
# Default value: 400
# Acceptable value range: From 50 to 4000
Voxel Draws Per Frame = 400

[5. Debug]

## Replaces the picture with the voxel copy of the world the light is traced through. Untinted = the fine volume (64 m), bluish = the middle one (256 m), reddish = the coarse one (1 km).
# Setting type: Boolean
# Default value: false
Show Voxel World = false

## Replaces the picture with the bounced light alone, as it falls on white surfaces: no textures, no sun, no lamps.
# Setting type: Boolean
# Default value: false
Show Indirect Light Only = false

## With Ray Tracing on: replaces the picture with the ray-traced light alone, on white surfaces (keep Show Indirect Light Only off with it). Split = ray-traced on the left half, the voxel light on the right. AmbientOcclusion = the AO laid on the ray-traced light, white = none. Albedo = the colour the ray tracing takes for each surface (faint stripes = the voxels' colour; magenta = not in the ray-traced scene: the gun, bots, grass) - the light starts over when you leave it. AlbedoVsGame = that on the left, the game's surface colour on the right. Sources = each pixel's own ray by where its light came from: red the sun, green the lamps, blue the rest (light cells, second bounce). Guided = green where Guided Light Rays has something to aim by, red where a ray was aimed. ShadowGuide = Keep Bounce Shadows' guide. History = the frames each pixel's light holds: white = History Frames, black = none, red = under 4.
# Setting type: RtViewMode
# Default value: Off
# Acceptable values: Off, Full, Split, AmbientOcclusion, Albedo, AlbedoVsGame, Sources, Guided, ShadowGuide, History
Show Ray Traced Light = Off

## The bounced light alone, with the pixels marked that found no neighbour on their own surface in the quarter-size lookup: green = it took a near neighbour's light, yellow = it borrowed with none near.
# Setting type: Boolean
# Default value: false
Show Edge Pixels = false

## Replaces the picture with where each pixel's light comes from: green = the 0.5 m light volume, blue-green = the 1 m one, yellow = the 2 m one, red = the 8 m one, blue = none of them (plain sky ambient). Darker = the surface counts as indoors.
# Setting type: Boolean
# Default value: false
Show Which Probes Answer = false

## See-Through Glass Windows: the glass shows one part of its light alone. SunShadow = the sun's shadow on it (white lit, black shadowed; red = no sample of a pane there, magenta = none made this frame); IndirectLight = the bounced light on it; ProbeAmbient = the light probes' ambient; Reflections = its reflections; SunLight = the sun's light on it. Off = the glass.
# Setting type: GlassViewMode
# Default value: Off
# Acceptable values: Off, SunShadow, IndirectLight, ProbeAmbient, Reflections, SunLight
Glass View = Off

## With Ray-Traced Direct Lamp Shadows on: the lamps' direct light (not the sun's) drawn in green, to see that TraceSix's copy of the game's light pass is the one in use. Leave off.
# Setting type: Boolean
# Default value: false
Mark Own Light Pass = false

## A test for the ray-traced sun's flicker (a whole object black for a moment): a sun ray that meets the inside of an object within a few centimetres of where it starts passes through it. If the flicker stops with this on, the object's level of detail was the cause. (A single-sided wall or roof met from behind that close then lets the sun through.)
# Setting type: Boolean
# Default value: true
Sun Rays Pass Their Own Object = true

## Tick while looking at something (a window, a doorway): writes to the log what a light ray from where you stand meets along your view in the voxel world, with the meshes there (unticks itself).
# Setting type: Boolean
# Default value: false
Log What The Voxels Hold Ahead = false

## Tick while aiming at a surface: writes to the log whether the voxel world has something overhead there, and which meshes are there, in the voxel world or left out of it (unticks itself).
# Setting type: Boolean
# Default value: false
Log What Is Overhead = false

## Tick while standing near a lamp: writes to the log every lamp within 15 m - spot or point, its cone, range, cookie, and how the bounced light takes it (unticks itself).
# Setting type: Boolean
# Default value: false
Log Lamps Near Me = false

## Tick in a raid: writes to the log how many lamps the map has, how many the game draws for your view now, how many of those render a shadow map, and the nearest shadowed ones by name (unticks itself).
# Setting type: Boolean
# Default value: false
Log Lamp Census = false

## Tick while standing where the floor under you is lit wrongly (a doorway): writes to the log how the light lookup goes for that floor, step by step (unticks itself).
# Setting type: Boolean
# Default value: false
Log Light Lookup Under Me = false

## Tick while aiming at a surface some way off that is lit wrongly: writes to the log which cell each light volume gives it and why the others are refused, what that cell holds, and which meshes around it are missing from the voxel world (unticks itself).
# Setting type: Boolean
# Default value: false
Log Light Lookup Ahead = false

## With Ray Tracing on, tick while aiming at a surface whose ray-traced colour (Show Ray Traced Light = AlbedoVsGame) differs from the game's: writes to the log its meshes' materials, shaders and vertex colours, and the materials the ray tracing took for them (unticks itself).
# Setting type: Boolean
