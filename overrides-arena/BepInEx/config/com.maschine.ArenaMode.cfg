[TeamFight]

## TeamFight with respawns: a continuous kill-count match (the Team Deathmatch rules below). Off = live TeamFight: one life per round, best of rounds, capture point after the opening phase.
# Setting type: Boolean
# Default value: false
Respawns = false

## Round wins that take the match (3 = best of 5).
# Setting type: Int32
# Default value: 3
# Acceptable value range: From 1 to 9
RoundsToWin = 3

## Seconds after a round starts during which bots push to the middle of the arena before fighting tactically.
# Setting type: Int32
# Default value: 15
# Acceptable value range: From 0 to 120
RushSeconds = 15

## Seconds into a round before the capture point appears.
# Setting type: Int32
# Default value: 90
# Acceptable value range: From 0 to 600
OpeningSeconds = 90

## Seconds one team must hold the point alone to win the round.
# Setting type: Int32
# Default value: 10
# Acceptable value range: From 1 to 60
CaptureSeconds = 10

## Seconds the point stays up; then the team with more players standing takes the round.
# Setting type: Int32
# Default value: 60
# Acceptable value range: From 5 to 600
CaptureWindowSeconds = 60

[Zombie]

## Infected allowed alive at once, across the whole raid. Also raises the native bot cap with reserve for activation and any authenticated PitFireTeam companions. The ceiling of 96 stays below the server clone's 104-bot capacity floor. Frozen at match start.
# Setting type: Int32
# Default value: 32
# Acceptable value range: From 4 to 96
MaxAlive = 32

## Safety net for a wave's last infected getting wedged in geometry or stranded on an unreachable NavMesh island: once the wave is SATURATED — every infected in it has already been requested, OR alive+pending already fills what MaxAlive/the wave's own remainder allows right now — and no infected has died for this long, whatever is still alive is administratively retired. If the wave still has spawns left after that, it keeps going (only the stuck survivor(s) were cleared); if not, the wave clears like normal. This measures PROGRESS, not mere duration: any infected death restarts the clock, so a wave the player is still actively (if slowly) clearing is never cleared out from under them — only saturation with no deaths at all for the whole ceiling is "stuck" (progress-not-duration changed 2026-10-06 after a GPU raid showed the old wall-clock-since-tail-start version ending a wave mid-fight; saturation arming added the same day after a second GPU raid showed a wave pinned at MaxAlive with 10 of 30 still to spawn and zero infected deaths for over four minutes never arming this at all, because it was never "fully spawned"). 0 disables the watchdog (the wave then waits for every infected to die naturally, with no recovery if one cannot reach the player). Frozen at match start.
# Setting type: Single
# Default value: 100
# Acceptable value range: From 0 to 600
StuckWaveTimeoutSeconds = 100

## Total infected in wave 1. Spawns and replacements are bounded by MaxAlive, so a wave may contain more infected than can be alive simultaneously. Frozen at match start.
# Setting type: Int32
# Default value: 50
# Acceptable value range: From 1 to 200
WaveStartSize = 50

## Extra infected each wave adds over the last: wave n = WaveStartSize + WaveGrowth * (n - 1). Frozen at match start.
# Setting type: Int32
# Default value: 20
# Acceptable value range: From 0 to 100
WaveGrowth = 20

## Countdown before the first wave and between cleared waves (everything spawned, nothing from the previous wave still alive). Starts after the player/team is ready. Frozen at match start.
# Setting type: Int32
# Default value: 10
# Acceptable value range: From 0 to 60
IntermissionSeconds = 10

## Seconds between individual infected spawn requests while a wave is filling up to MaxAlive or refilling a gap a kill just opened. Lower values reach MaxAlive faster and refill kills with less of a gap. Frozen at match start.
# Setting type: Single
# Default value: 0.2
# Acceptable value range: From 0.2 to 10
SpawnIntervalSeconds = 0.2

## Percent chance each spawned infected is the hard/Shooting variant (PM pistol) instead of normal/Fast melee. 0 keeps every infected melee; 100 makes every infected a shooter. Never easy (too slow to matter) or impossible (the native brain throws on construction). Frozen at match start.
# Setting type: Int32
# Default value: 20
# Acceptable value range: From 0 to 100
ShooterPercent = 20

## Avoid redundant PitFireTeam layer inspection for verified native Arena infected. Standby wake-up, companions and custom brains retain the original path. Turn off for comparison or compatibility troubleshooting; applies immediately.
# Setting type: Boolean
# Default value: true
PftFastPathEnabled = true

## Limit overlapping repetitive infected voices in Arena Zombies. Nearby attack calls, critical sounds, AI hearing and companions keep native behavior. Turn off for comparison; applies immediately.
# Setting type: Boolean
# Default value: true
VoiceBudgetEnabled = true

## Optional, harder Zombie horde behavior. Generic infected farther than 26 m may teleport to clear, connected 12/16/22 m rings around the player. Melee infected within 80 m skip sight casts; infected skip local avoidance and clear residual offsets. Shooters keep native vision. Rendering is always native. OFF restores pre-Crowd behavior without crowd teleports, sight or avoidance overrides; applies immediately. Previously moved bots stay at their current position. Existing saved choices are preserved.
# Setting type: Boolean
# Default value: false
CrowdEnabled = false

## Let Unity skip the body animation of a generic infected that no camera renders (shadows included), even inside the game's own 10 m always-animate radius, the way the game already does beyond it. The infected keeps moving and deciding; only retargeting and bone writes pause while it is unseen. Never applied to an infected within reach of a possible target or mid-swing, so hits from behind still land. Trade-off, the same the game accepts beyond 10 m: an unseen body keeps its last written pose (hit zones included) until it is seen again, and a corpse made unseen starts its fall from that pose. Pays off together with HideOffscreenShadows. Performance switch for measurement; off = native. Applies immediately.
# Setting type: Boolean
# Default value: false
CullOffscreenAnimators = false

## Switch off the shadows of a generic infected while it is outside the camera's view, so it is no longer drawn into every shadow cascade behind the player. Only Arena's own changes are tracked and put back the moment the body is in view again, when it dies, when its pooled gear returns to the pool, and at raid end. While a magnified scope renders, everything in front of you keeps its shadows. A shadow the sky light throws into your view from an unseen infected stays (up to 15 m along the ground); shadows from lamps behind you are not predicted and can vanish with their caster. Performance switch for measurement; off = native. Applies immediately.
# Setting type: Boolean
# Default value: false
HideOffscreenShadows = false

## Bring your own protected equipment instead of a random Arena kit. Solo play restores your entry loadout, including ammunition, after each cleared wave; your first death ends the match. With PitFireTeam, own gear is required: the PMC and companions restore their entry equipment and ammunition each wave, including a surviving PMC. Fallen squad members return after a cleared wave; a team wipe ends the match. Frozen at match start.
# Setting type: Boolean
# Default value: true
OwnGear = true

## Recorded seconds shown after death; 0 keeps instant respawn. Requires enabled Killcam. Respawn waits for actual playback, slow motion and live tail. Frozen when the raid is armed.
# Setting type: Single
# Default value: 0
# Acceptable value range: From 0 to 10
ReplaySeconds = 0

## Per-mode gate for the Arena announcer (stingers, round/match cues and the on-screen kill callouts such as DOUBLE KILL). The global Audio/Announcer switch above stays a master gate: both it and this must be on for this mode's announcer to speak and show its callouts; AnnouncerVolume stays global too. Frozen like the other per-mode mutators while the raid is active or armed. HUD text callouts (e.g. WAVE n) are a separate system and are unaffected by either switch.
# Setting type: Boolean
# Default value: false
Announcer = false

## Allow damage between the PMC and PitFireTeam companions, including companion-to-companion damage. Frozen at arming; solo Zombies, enemy damage and self-damage are unchanged.
# Setting type: Boolean
# Default value: false
FriendlyFire = false

