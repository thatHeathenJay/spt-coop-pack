## Settings file was created by plugin maschine-ArenaMode v0.4.1
## Plugin GUID: com.maschine.ArenaMode

[Arena]

## Disable Labyrinth's entrance gun, flame, liquid and steam traps and drain the toxic pool during Arena only, including their active damage, animations and continuous sounds. Read once per raid; changes apply to the next Arena raid. Other puzzles/traps and ordinary raids are unchanged.
# Setting type: Boolean
# Default value: true
DisableLabyrinthSpawnTraps = true

[Arena incendiary prototype]

## WIP: adds one Molotov per equipment loadout in free rig/pocket space during live Arena (except Zombies); existing grenades are kept. G selects the bonus first; later manual selection is preserved. Uses the dedicated Arena Molotov bottle item; only the bonus creates 6-second ground fire (100 base total HP/s, non-stacking). Full rig/pockets: no bonus, nothing replaced. Requires the matching BigBrain companion. Disabling safely extinguishes owned fire; no extra supply from toggling off/on.
# Setting type: Boolean
# Default value: true
Enabled = false

[Arena pickups]

## Arena-owned pickups in Deathmatch and Team Deathmatch on all supported Arena maps, including the selected Customs area. Optional maschine-ArenaMode/Pickups.json replaces the built-in layouts. Layouts are frozen per match. Disabling clears this match's pickups and effects.
# Setting type: Boolean
# Default value: true
Enabled = false

## Successful local pickup sound volume; 0 mutes it. Independent of interface, hitmarker and announcer volume; master mute remains respected.
# Setting type: Single
# Default value: 0.7
# Acceptable value range: From 0 to 1
SoundVolume = 0.7

## Allow living Arena bots on either side to collect damage/shield/health pickups. The bundled companion for BigBrain 1.5.0 or newer also directs idle/searching bots to useful available pickups, yielding to combat and danger. Weapons, Jump Boots and Infinite Ammo are local-player-only.
# Setting type: Boolean
# Default value: true
BotsCollectPowerups = true

## Pickup weapon: pickup-m60-retzrestdfg is the copied M60E6 with MRS, blue laser and 100 M993 rounds. Any existing catalogue kit ID also works (weapon only, no spare magazines or armor). Read at match start.
# Setting type: String
# Default value: pickup-m60-retzrestdfg
PrototypeWeaponKit = pickup-m60-retzrestdfg

## Internal one-time migration of the old spartan prototype default to M60; leave enabled. Other kits and later manual choices are preserved.
# Setting type: Boolean
# Default value: false
M60DefaultMigrated = true

[Audio]

## Automatic Arena-only PMC callouts for reloads, grenades, empty weapons and occasional kills. The announcer has priority. Independently of this switch, Team DM and Domination keep a faction voice per match, including English BEAR voices, across respawns. Other modes keep your chosen voice. Your profile is never changed.
# Setting type: Boolean
# Default value: true
PmcVoicelines = true

## Short Arena hit, headshot and kill sounds, independent of the visual HUD and announcer. Replaceable PCM16 mono WAVs in BepInEx/plugins/maschine-ArenaMode/sounds/; see docs/licenses/audio/AUDIO-LICENSES.md.
# Setting type: Boolean
# Default value: true
HitmarkerSounds = true

## Hitmarker sound volume, independent of Interface and announcer volume. Still respects overall game volume and mute; changes apply immediately.
# Setting type: Single
# Default value: 0.7
# Acceptable value range: From 0 to 1
HitmarkerVolume = 0.7

## Announcer stingers (combat awards, streaks, Tactical round/match cues) — plays .ogg files from BepInEx/plugins/maschine-ArenaMode/announcements/. Missing sounds are skipped and logged. Master switch: when off, the on-screen kill callouts (DOUBLE KILL, ...) are hidden too.
# Setting type: Boolean
# Default value: true
Announcer = false

## Announcer volume, independent of Interface volume by default. Still respects the game's overall volume and mute.
# Setting type: Single
# Default value: 0.7
# Acceptable value range: From 0 to 1
AnnouncerVolume = 0.7

## Off: use the dedicated Arena output controlled by AnnouncerVolume and overall game volume. On: restore the legacy Interface-volume output for compatibility.
# Setting type: Boolean
# Default value: false
AnnouncerUseUiVolume = false

## Silence the repeating center siren on Labyrinth during Arena only. Other sounds and map triggers are unchanged. Takes effect immediately; turning this off lets an active alarm resume at its next sound cycle (about 4 seconds).
# Setting type: Boolean
# Default value: true
MuteLabyrinthAlarm = true

[Bot movement]

## Boost grounded Arena bots on both teams, including PitFireTeam followers. Also enables supported SAIN search sprint, shorter completed-reload wait and faster combat strafe. Includes faster starts/direction blending and reduced weight-related locomotion inertia. Does not change the local player, ordinary raids, presets or weapon animations.
# Setting type: Boolean
# Default value: true
BotMovementEnabled = false

## Arena bot walk/strafe displacement multiplier. Preserves native slowdowns; the bonus fades near native path corners and is suppressed during door handling or large low-FPS steps. 1 = no boost.
# Setting type: Single
# Default value: 1.5
# Acceptable value range: From 1 to 1.5
BotWalkSpeedMult = 1.5

## Arena bot sprint displacement multiplier. Only affects a sprint the AI already chose; does not force sprint or add stamina. Safety limits can reduce the bonus. 1 = no boost.
# Setting type: Single
# Default value: 1.5
# Acceptable value range: From 1 to 1.5
BotSprintSpeedMult = 1.5

[Bots]

## Minimum PMCs alive. Top-up waves spawn PMCs (alternating USEC/BEAR) until this many are around, and only fill up with scavs after that.
# Setting type: Int32
# Default value: 8
# Acceptable value range: From 0 to 20
PmcFloor = 8

## Keep pointing every living bot at the player's position, so they actively close in instead of patrolling until they happen to see you. Team Deathmatch instead keeps both factions aware of live opponents.
# Setting type: Boolean
# Default value: true
HuntPlayer = true

## SAIN preset name this install forces instead of the server's forced preset (empty = server's choice). The Arena client sets this to its own preset; the preset must exist on the server (SAIN Presets folder).
