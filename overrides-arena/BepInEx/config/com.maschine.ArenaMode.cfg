[Performance]

## Let bot and kit loading borrow frame time while it is running. Once a frame is over the game's scheduler budget (1000 / framerate limit, the lobby limit if the game limit is off), loading advances one pass per frame instead of running until the budget is spent - so a machine held at 60 fps under a 120 limit turns a one-second bot load into a minute. This re-enables the scheduler's own force mode for the duration of a load, at the cost of a longer frame while it runs. Arena only.
# Setting type: Boolean
# Default value: true
BotLoadBoost = true

## Loading time granted per frame while boosted, as a multiple of half the target frame (at a 120 fps limit, 1.0 = 4 ms; the value scales with the limit). Untested above 1: on the scheduler's arithmetic only instantiation-bound steps get faster, while every asynchronous wait still costs at least one frame and that frame is longer by the extra budget. 3 is the game's own loading-screen value.
# Setting type: Single
# Default value: 1
# Acceptable value range: From 0.25 to 3
BotLoadBoostBudget = 1

## How long loading must have been running before the boost kicks in on a machine the scheduler sees as under budget, so one that finishes each load inside this window never pays a frame for it. A machine it sees as over budget boosts after 0.25 s regardless (or this value if lower): there the boost is the only thing moving loads at all - and a fast machine in a heavy moment reads over budget too, which is a trade the log line shows. The verdict is fixed per load episode. Gaps under half a second between loads do not restart the clock.
# Setting type: Single
# Default value: 1
# Acceptable value range: From 0 to 10
BotLoadBoostDelaySeconds = 1

## EXPERIMENTAL, off by default. Unity's per-frame time slice for finishing asynchronous loads, held at this level while the boost is held. On maps that use the game's scene streamer it drops the slice to Low (2 ms a frame) and never puts it back; no arena map has been shown to do that, and without it the value is Unity's own default - which the boost's log line now reports, so a raid settles it. Raising it only helps if a single load's integration needs more than the slice it has, which nothing has measured, while the cost is certain: main-thread time ON TOP of the step budget, paid during live combat. Low = 2 ms, BelowNormal = 4, Normal = 10, High = 50 (about 15 fps on a 60 fps machine while loading - diagnostic only). Game = leave it alone. Handed back on release.
# Setting type: AsyncLoadPriority
# Default value: Game
# Acceptable values: Game, Low, BelowNormal, Normal, High
BotLoadBoostAsyncPriority = Game

## Load the arena kit's item bundles while the raid is still loading, instead of on the first second of the raid. In the loading screen the game's own loading mode multiplies the in-raid step budget (by 3 unless the app config says otherwise) and nothing else is asking for the loader yet; measured on Customs, the start kit took 22 s to load on a 60 fps machine (10 s on a fast one) once the raid had begun, sharing the loader with the first bots. InitialKit = the kit the raid starts you in (the random draw is made in the loading screen and kept for the raid start); Gun Game also warms the second and third selected weapon stages in that opening batch. WholeCatalogue = every other kit as well, one after another, for as long as the loading screen lasts; whatever has not started when the raid begins is left to the in-raid warm-up as before, and a respawn that lands while one kit is still loading waits for that kit. Untested on a slow machine - try it and read the log lines. Off = the previous behaviour. Arena only.
# Setting type: KitPreloadScope
# Default value: InitialKit
# Acceptable values: Off, InitialKit, WholeCatalogue
KitPreloadInLoadingScreen = InitialKit

## Visible corpses kept. Older ones are hidden for performance — they stay in the world but become invisible and can no longer be looted (0 = keep all).
# Setting type: Int32
# Default value: 10
# Acceptable value range: From 0 to 50
MaxCorpses = 10

## Take the gear off corpses once they are hidden. Every worn item is an instantiated model, and late-raid bodies wear far more of them than early ones — removing it hands each model back to its pool.
# Setting type: Boolean
# Default value: true
StripCorpseGear = true

## Take a hidden corpse out of the scene for good once nothing can reach it any more, instead of leaving it lying there invisible. A hidden body is still a complete player object, and every search over the scene — the game's own included — gets slower with each one that is left. PitFireTeam teammates and your own NEWEST body are never taken away; an older body of your own is released like anybody else's, once nothing still needs it.
# Setting type: Boolean
# Default value: true
ReleaseTrimmedCorpses = true

## Switch Unity's incremental garbage collector back on once the managed heap passes this many GB during an arena raid, instead of leaving it off for the whole raid the way EFT does by default. 0 = never (pure vanilla): the heap grows unbounded for as long as the raid runs, same as an ordinary raid on a machine with enough RAM. Only acts while an arena session is active AND the collector is currently disabled — on a machine EFT itself kept it enabled (under 25 GB system RAM by default) this setting has nothing to switch. The switch itself is EFT's own cheap collector-mode assignment, never a forced collection, and it is timed to a local death, a round break, or a bounded 120 s wait if neither comes first, so a short raid never pays for it and a long one stays bounded. See GC-THRESHOLD-REVIEW.md for the measured cost.
# Setting type: Single
# Default value: 4
# Acceptable value range: From 0 to 32
GcHeapThresholdGB = 4

## Cap how many idle instances EFT's own asset-prewarm keeps per resource (weapons, AFAKs, survival kits, hands prefabs, ...) during an arena raid, instead of letting it grow to match every bot that has ever spawned. 0 = never (pure vanilla): ObjectsFactory.InitAndFillPools sizes every pool to the TOTAL request count across the whole raid and that count never drops, so Arena's continuous respawn keeps growing every pool for as long as the raid runs (measured: 210 idle AFAKs and 207 idle survival kits after 267 bodies in 17 minutes, ~380 stale components per body). Only acts while an arena session is active AND the request is EFT's own periodic top-up to total demand (reason "LoadPlayerResources") — pool CREATION and the separate MaintainMinPoolSize top-up are never touched, and a pool run down to this cap still creates on demand exactly as vanilla does for any pool's first use, so a spawn is never short an item, only the standing idle surplus is bounded. See POOL-PREWARM-REVIEW.md for the measured cost.
# Setting type: Int32
# Default value: 4
# Acceptable value range: From 0 to 64
PoolPrewarmKeepIdle = 4

## Empty the AI core's removal queue of dead bot brains after it has been applied, during an arena raid. The game removes every queued brain from its agent set on every frame but never clears the queue, so a raid with hundreds of bot deaths repeats the whole removal each frame and keeps every dead brain (with its BotOwner) reachable until the raid ends. The agent set ends up exactly as the native pass leaves it; only the repeated no-op work and the retention go. Off = vanilla. Applies immediately.
# Setting type: Boolean
# Default value: true
TrimDeadBrainList = true

## Run the two statements of a bot's per-frame FOV coroutine directly instead of starting a coroutine for every alive bot on every frame, during an arena raid. For a third-person (bot) body the coroutine only sets the ribcage scale to one and puts a drifted scale back at the end of the frame; nothing reads either value in between for a bot. Your own body keeps its coroutine. Off = vanilla. Applies immediately.
# Setting type: Boolean
# Default value: true
SkipBotFovCoroutine = true

## Build the bot profiles of one server answer over several frames, spending at most this many milliseconds per frame on ADDITIONAL profiles, during an arena raid. The game builds every profile of a /client/game/bot/generate answer in the frame it arrives, which in a Zombie raid is one frame of 600-1700 ms about 90-100 s in (the next spawn batch). One profile per open batch is always built per frame, so the effective cap is this budget or one profile's cost (about 9 ms here), whichever is larger, and a batch of N profiles takes at most about N frames; the request itself is unchanged and the caller still receives the whole batch at once, about a second later than before. 0 = native (all in one frame). Applies to the next batch.
# Setting type: Single
# Default value: 3
# Acceptable value range: From 0 to 20
ProfileBuildBudgetMs = 3

## Stop bots working over corpses. They swap gear on the spot and drop what they were wearing, and nothing ever cleans a dropped item up.
# Setting type: Boolean
# Default value: true
NoCorpseLooting = true

## Switch off flashlights and lasers on corpses. Shadow-casting lights are expensive and dead bodies keep theirs on forever; a looted flashlight still works normally.
# Setting type: Boolean
# Default value: true
CorpseLightsOff = true

