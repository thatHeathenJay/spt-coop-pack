BleedingDamageMultiplier = 3

## Application speed for the local PMC's medkits, bandages, splints, surgery kits, pills and injectors during an arena raid. Both the health effect and hands animation use this factor; 1 keeps vanilla timing.
# Setting type: Single
# Default value: 2
# Acceptable value range: From 1 to 4
MedicalUseSpeed = 1

## Loading and unloading speed for loose rounds in the local PMC's magazines through the raid inventory, including internal magazines, during an arena raid. 1 keeps vanilla timing; this does not change weapon or hands reload animations.
# Setting type: Single
# Default value: 2
# Acceptable value range: From 1 to 4
MagazineHandlingSpeed = 2

[Combat]

