# Default value: 
SainPreset = Arena

## Arena only: replace SAIN Rat, Timmy and Coward assignments with the current preset's Normal personality. Other personalities and SAIN preset files stay unchanged. Start a new raid when comparing this setting; existing bots are not reassigned. PFT keeps its own follower combat behavior.
# Setting type: Boolean
# Default value: true
ExcludePassiveSainPersonalities = true

## Stop bots pausing for friendly hand signals during an arena raid. Vanilla pairs a bot with the nearest bot of any side for a gesture, and every gesture throws a random item out of the bot's secure container — with SPT's bot loot that is a PMC's Surv12 or AFAK, left on the ground.
# Setting type: Boolean
# Default value: true
NoBotGestures = true

[Character]

## Run every character skill at elite level during an arena raid (kit weapons count as mastered too). Reverted when the raid ends; the saved profile is never touched.
# Setting type: Boolean
# Default value: true
MaxSkills = true

## Reduction of the walking-speed penalty from fractured or destroyed legs during an arena raid. 50 halves the penalty (one leg: 0.30 to 0.65; both legs: 0.20 to 0.60). Injuries and the vanilla sprint restriction remain active; 0 keeps vanilla movement.
